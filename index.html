<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23963BFA'>✦</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="description"
    content="Aditya Pratap Singh Bhadauria — Software Engineer, AI/ML Engineer, Full-Stack Developer. Turning ambitious ideas into intelligent experiences." />
  <meta name="theme-color" content="#F7F4FC" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Aditya Pratap Singh Bhadauria — Software & AI Engineer</title>

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Instrument Serif (Emotion Agency Editorial Serif), Cormorant Garamond, Cinzel, Plus Jakarta Sans, JetBrains Mono -->
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Cinzel:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <!-- Immediate Theme Initialization (prevents startup flash) -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('portfolio_theme');
        var theme = saved === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
